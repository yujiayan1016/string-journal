name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: |
          chmod +x build.sh
          UNIVERSAL=1 ./build.sh
      - name: Zip
        run: |
          VERSION="$(cat VERSION)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd build && ditto -c -k --keepParent "绳上手帐.app" "StringJournal-$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StringJournal
          path: build/StringJournal-*.zip
      # every push to main refreshes the download on the Releases page
      # release text = docs/release-notes/<VERSION>.md (if any) + install steps
      - name: Release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          NOTES="docs/release-notes/$VERSION.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; echo; echo "---"; echo; echo "## 安装"; echo; fi
            echo "下载下面的 \`StringJournal-$VERSION.zip\`，解压后把「绳上手帐.app」拖进「应用程序」。"
            echo
            echo "第一次打开会提示无法验证开发者：到 系统设置 → 隐私与安全性，点「仍要打开」。"
            echo "或者在终端运行：\`xattr -dr com.apple.quarantine \"/Applications/绳上手帐.app\"\`"
            echo
            echo "需要 macOS 13 或更新版本，支持 Apple 芯片和 Intel。"
          } > build/release-notes.md
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: 绳上手帐 ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/StringJournal-${{ env.VERSION }}.zip
          body_path: build/release-notes.md
